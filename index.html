    <!-- IMPORTANT: These script tags load your React app -->
    <script type="module">
      // Dynamically load the built assets
      const isProduction = window.location.hostname.includes('github.io');
      
      if (isProduction) {
        // Load the built assets from the correct path
        const loadAsset = (src) => {
          return new Promise((resolve, reject) => {
            const script = document.createElement('script');
            script.type = 'module';
            script.src = src;
            script.onload = resolve;
            script.onerror = reject;
            document.body.appendChild(script);
          });
        };
        
        // Load the main JS bundle
        loadAsset('/my-porfolio2.0/assets/main-0pIQtlZv.js').catch(err => {
          console.error('Failed to load main bundle:', err);
          // Fallback: try to load from the current path
          loadAsset('./assets/main-0pIQtlZv.js');
        });
      } else {
        // Development mode
        import('/src/main.tsx');
      }
    </script>
    
    <!-- Link CSS -->
